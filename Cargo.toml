[package]
name = "journal"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "journal"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.31", features = ["bundled"] }
git2 = "0.19"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
dirs = "5"
toml = "0.8"
colored = "2"
comfy-table = "7"
tempfile = "3"
anyhow = "1"
ratatui = "0.29"
crossterm = "0.28"
